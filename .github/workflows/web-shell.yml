name: Web shell integrity

on:
  push:
    branches:
      - main
      - phase-1-zero-cost-architecture-clean
    paths:
      - "web/**"
      - ".github/workflows/web-shell.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-shell.yml"

permissions:
  contents: read

jobs:
  static-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check browser module syntax
        run: |
          node --input-type=module --check < web/config.js
          node --input-type=module --check < web/api.js
          node --input-type=module --check < web/app.js
      - name: Run static shell integrity tests
        run: python -m unittest discover -s web/tests -v
