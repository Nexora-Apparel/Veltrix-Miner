name: Staging smoke verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    if: ${{ vars.VELTRIX_STAGING_SMOKE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      VELTRIX_STAGING_BASE_URL: ${{ vars.VELTRIX_STAGING_BASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify protected staging API
        run: python -m app.staging_smoke
